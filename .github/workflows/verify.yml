name: Verify

# 类型检查、Lint 与架构检查。
#
# 触发方式：**仅手动触发**（Actions 页面 Run workflow）。本仓库不配置任何自动触发器，
# 不会因为 push 或 PR 自动消耗构建资源。
#
# 每个检查步骤都带 if: always()，任何一道失败都不会掩盖其余几道的结果。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"

jobs:
  verify:
    name: typecheck / lint / architecture
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      # 根 typecheck 是 `tsc -b <packages/* 列表>`，**不包含 apps/zcode-cli/**。
      # 而 CLI 各包的 exports 指向 dist（不像 @zcode/shared 导出源码），
      # 必须按依赖顺序先构建再检查，无法并入根 tsc -b。
      # 缺少这一步时，"新增了 import 但没在 package.json 声明 workspace 依赖"
      # 这类错误要到 desktop/cli 构建阶段才会暴露——曾经就漏过一次。
      #
      # 走 build-desktop-agent-cli.mjs 而不是 `pnpm --dir apps/zcode-cli run typecheck`：
      #   - apps/zcode-cli 是**独立嵌套 workspace**（自带 pnpm-lock.yaml 与
      #     pnpm-workspace.yaml），turbo 是它自己的 devDependency，根 install 不装它，
      #     直接调用会报 `sh: 1: turbo: not found`；
      #   - 而 CLI 各包本身也在**根 workspace** 里（根 pnpm-workspace.yaml 含
      #     apps/zcode-cli/packages/*），根 pnpm --filter 就能构建；
      #   - 该脚本内置有序包清单，复用它可避免在 workflow 里重复维护一份会漂移的列表。
      #
      # 代价是要多跑一次 agent 构建（比单纯 tsc 慢），换来的是与 desktop / CLI
      # 构建链路完全一致的检查面。verify 仅手动触发，这个代价可接受。
      - name: Build CLI workspace (agent bundle preflight)
        run: node scripts/build-desktop-agent-cli.mjs
        env:
          # 与 build-desktop / build-cli 的构建步骤保持一致：该脚本会物化内置 Provider
          # 配置，环境取值必须相同，否则这里的检查面与真实构建不等价。
          ZCODE_ENV: "production"

      - name: Typecheck
        if: always()
        run: pnpm typecheck

      - name: Lint
        if: always()
        run: pnpm lint

      - name: Architecture check
        if: always()
        run: pnpm architecture:check

