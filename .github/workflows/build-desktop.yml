name: Build Desktop

# 构建 Windows / macOS 桌面安装包。
#
# 触发方式：**仅手动触发**（Actions 页面 Run workflow）。本仓库不配置任何自动触发器，
# 不会因为 push、tag 或 PR 自动消耗构建资源。
#
# 产物：
#   - 每次运行都上传 Actions artifacts，保留 1 天。
#   - 填了 release_tag（或从 tag ref 手动运行时）额外上传到 GitHub Release。
#
# 签名：默认产出**未签名**包。仓库的 electron-builder 配置要求显式
# ZCODE_ENABLE_MAC_SIGN=1 且提供 APPLE_SIGNING_IDENTITY / CSC_NAME 才启用
# macOS 签名，并已内置 notarize: false。需要签名时再补证书与 secrets。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布到该 tag 的 GitHub Release（留空则只上传 artifacts）
        required: false
        type: string
      local_identity:
        description: 使用 Local 身份构建（可与官方版并存，且业务数据默认隔离）
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: mac
            arch: arm64
            # 固定 macOS 版本而非 -latest：运行包含 node-pty 等原生产物，
            # 构建基线的 OS 版本会直接影响产物的最低系统要求，不应随镜像自动漂移。
            runner: macos-15
            artifact_glob: |
              packages/desktop/dist/*.dmg
              packages/desktop/dist/*.zip
          - label: macOS x64
            os: mac
            arch: x64
            # Intel runner。注意 macos-13 已于 2025-12-04 退役，
            # 当前可用的标准 Intel 标签是 macos-15-intel。
            runner: macos-15-intel
            artifact_glob: |
              packages/desktop/dist/*.dmg
              packages/desktop/dist/*.zip
          - label: Windows x64
            os: win
            arch: x64
            # 用 windows-2022 而不是 windows-2025：后者预装 Visual Studio 2026（版本号 18），
            # 而 node-gyp 11.5.0 的 VS 探测不认识该版本，会报
            #   gyp ERR! find VS unknown version "undefined" found at
            #   "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
            # 导致 ssh2 的可选原生加速模块 cpu-features 编译失败。
            # 该失败本身不致命（ssh2 会回退纯 JS 实现），但会在日志里刷几十行噪音，
            # 也掩盖真正的错误。windows-2022 预装 VS 2022（v17），node-gyp 可正常识别。
            #
            # 注：macOS 上 cpu-features 能正常编译，所以不要改 pnpm-workspace.yaml 的
            # allowBuilds 去全局关闭它 —— 那会白白让 macOS/Linux 失去 AES 硬件加速。
            # 待 node-gyp 支持 VS 18 后可改回 windows-2025。
            runner: windows-2022
            artifact_glob: |
              packages/desktop/dist/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # release 版本号与构建元数据需要完整 tag 历史。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # CI 不需要 git hooks。
          HUSKY: "0"

      - name: Bundle desktop (${{ matrix.os }}/${{ matrix.arch }})
        # bundle.mjs 会依次执行 prepare:runtime-assets、pnpm build、
        # electron-builder、运行时依赖校验与体积审计。
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }}
        env:
          # 必须显式指定生产环境。未设置时 ZCODE_ENV 回退为 test，会导致：
          #   1. 产品身份变成 Preview（productName "ZCode Preview"、appId 加 .preview）
          #   2. 产物文件名被加上 _TEST 后缀
          #   3. 包内指向测试后端
          # electron-builder.config.js 用 builtinProviderConfig.environment 覆盖 ZCODE_ENV，
          # 而后者默认也是 test，所以不注入就拿不到正式包。
          ZCODE_ENV: "production"
          # 桌面安装包不依赖 mock-cdn 远程资源；跳过可显著缩短构建时间。
          ZCODE_SKIP_REMOTE_ASSETS: "1"
          # 与官方版并存：Local 身份使用独立的 productName（ZCode Local）、
          # appId（dev.zcode.app.local）、Electron 数据目录，并且**业务数据根默认切到
          # ~/.zcode-local-home**，因此安装后无需任何环境变量即可与官方版完全隔离。
          # 该变量只接受 "1" / "0" / 空，其他取值会直接抛错。
          ZCODE_LOCAL_IDENTITY: ${{ inputs.local_identity && '1' || '0' }}
          # 未签名构建：禁止 electron-builder 自动发现本机签名身份。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zcode-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 1

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # 产物名含空格（"ZCode Local-3.14.0-mac-arm64.dmg"）。不能用
          # `files=$(ls ...)` 再展开不带引号的 $files —— word splitting 会把
          # 文件名从空格处拆开，得到一堆不存在的路径（zsh 报 no matches found，
          # bash 则把 "dist/ZCode" 和 "Local-..." 当两个文件传给 gh）。
          # 这里用 NUL 分隔读入数组，逐项加引号展开。
          # 刻意不发布 *.blockmap 与 *.yml：
          # blockmap 是 electron-builder 的差分更新索引，*.yml 是配套更新元数据，
          # 二者只服务自动更新。而 Local 身份不启用自动更新
          # （index.ts 的 initAutoUpdater 只在 flavor === "production" 时启用），
          # 所以对本发行版它们是纯废重量。
          # 只发布 dmg（安装包）、zip（macOS 便携版）、exe（NSIS 安装程序）。
          files=()
          while IFS= read -r -d '' path; do
            files+=("$path")
          done < <(find packages/desktop/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::未找到桌面安装包产物"
            exit 1
          fi

          # 矩阵中多个 job 会并发进入；创建失败说明别的 job 已经建好，忽略即可。
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" "${files[@]}" --clobber
          printf '已上传到 Release %s：\n' "$TAG"
          printf '  %s\n' "${files[@]}"
