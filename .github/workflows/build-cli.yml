name: Build CLI

# 构建 Windows / macOS 命令行运行包（zcode）。
#
# 触发方式：**仅手动触发**（Actions 页面 Run workflow）。本仓库不配置任何自动触发器，
# 不会因为 push、tag 或 PR 自动消耗构建资源。
#
# 产物：
#   - 每次运行都上传 Actions artifacts，保留 1 天。
#   - 填了 release_tag（或从 tag ref 手动运行时）额外上传到 GitHub Release。
#
# 关于平台差异：
#   scripts/build-zcode.mjs 按**宿主平台**打包（无 --os/--arch 参数），运行包内含
#   TUI 原生库与 node-pty 等平台相关产物，因此必须在各目标平台的原生 runner 上分别构建。
#   上游把运行包命名为 `zcode-<version>.tar.gz`（不带平台标识），多平台产物同名会在
#   Release 里互相覆盖。这里在构建后重命名为 `zcode-<version>-<platform>.tar.gz`
#   并重新生成对应的 sha256 文件；运行包内部的 install.sh / latest.json 仍保持原样，
#   单平台自建镜像可直接使用。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布到该 tag 的 GitHub Release（留空则只上传 artifacts）
        required: false
        type: string
      dist_base_url:
        description: install.sh 使用的下载根地址
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-arm64
            # 固定 macOS 版本而非 -latest：运行包含 node-pty 等原生产物，
            # 构建基线不应随镜像自动漂移。
            runner: macos-15
          - label: macOS x64
            platform: macos-x64
            # macos-13 已于 2025-12-04 退役；标准 Intel 标签是 macos-15-intel。
            runner: macos-15-intel
          - label: Windows x64
            platform: windows-x64
            # 与 build-desktop 同因：windows-2025 预装的 VS 2026（版本号 18）
            # 不被 node-gyp 11.5.0 识别，会让 ssh2 的可选模块 cpu-features 编译失败
            # （不致命，但日志噪音很大）。windows-2022 预装 VS 2022，可正常识别。
            runner: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build CLI runtime package
        shell: bash
        env:
          # 必须显式指定生产环境。运行包内含 web 产物（packages/web 由 vite 构建），
          # 其 ZCODE_ENV 未设置时回退为 test，会把测试后端与测试 endpoint 打进发行包。
          ZCODE_ENV: "production"
          # build-zcode.mjs 要求 --base-url 或 ZCODE_DIST_BASE_URL，二者必居其一。
          ZCODE_DIST_BASE_URL: ${{ inputs.dist_base_url || format('https://github.com/{0}/releases/latest/download/', github.repository) }}
        run: |
          set -euo pipefail
          node scripts/build-zcode.mjs \
            --base-url "$ZCODE_DIST_BASE_URL" \
            --out-dir "dist/zcode-${{ matrix.platform }}"

      - name: Rename tarball for this platform
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync, renameSync, existsSync } from "node:fs";
          import { basename, join } from "node:path";

          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const platform = process.argv[1];
          const releaseDir = join("dist", `zcode-${platform}`, "releases", version);
          const original = join(releaseDir, `zcode-${version}.tar.gz`);
          if (!existsSync(original)) {
            console.error(`未找到运行包: ${original}`);
            process.exit(1);
          }
          const renamed = join(releaseDir, `zcode-${version}-${platform}.tar.gz`);
          renameSync(original, renamed);
          const hash = createHash("sha256").update(readFileSync(renamed)).digest("hex");
          writeFileSync(
            join(releaseDir, `sha256-${platform}.txt`),
            `${hash}  ${basename(renamed)}\n`,
          );
          console.log(`[cli] ${basename(renamed)}`);
          console.log(`[cli] sha256 ${hash}`);
          ' "${{ matrix.platform }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zcode-cli-${{ matrix.platform }}
          path: dist/zcode-${{ matrix.platform }}/**
          if-no-files-found: error
          retention-days: 1

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          release_dir="dist/zcode-${{ matrix.platform }}/releases/${version}"
          files=$(ls "$release_dir"/*.tar.gz "$release_dir"/sha256-*.txt 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::未找到 CLI 运行包产物"
            exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" $files --clobber
          echo "已上传到 Release $TAG："
          echo "$files"
